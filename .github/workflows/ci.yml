name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify org artifacts
        run: |
          test -f LICENSE
          test -f NOTICE
          test -f ARCHITECTURE.md
          test -f README.md || test -f readme.md
